<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>EngagED Bug Report Builder</title>
  <style>
    :root{--bg:#0b0b0b;--surface:rgba(255,255,255,0.04);--accent1:#da0061;--accent2:#0090ff;--text:#fff}
    *,*::before,*::after{box-sizing:border-box}
    html,body{margin:0;padding:18px;max-width:980px;min-width:760px;min-height:920px;background:linear-gradient(180deg,#070707,#0f0f10);font-family:Inter,Arial,Helvetica,sans-serif;color:var(--text);overflow-x:hidden}
    .panel{background:var(--surface);padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,0.06);max-width:100%}
    label{display:block;font-weight:700;margin-top:8px;font-size:12px}
    input,textarea,select{width:100%;padding:8px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);background:transparent;color:var(--text);margin-top:6px;word-break:break-word}
    textarea{min-height:96px;resize:vertical}
    .row{display:flex;gap:8px}
    .btn{display:inline-block;padding:8px 10px;border-radius:8px;border:none;cursor:pointer;font-weight:700}
    .btn.primary{background:linear-gradient(90deg,var(--accent1),var(--accent2));color:#fff}
    .preview{white-space:pre-wrap;background:rgba(0,0,0,0.2);padding:10px;border-radius:8px;margin-top:8px;font-family:monospace;font-size:12px;max-height:360px;overflow:auto}
    .muted{font-size:12px;color:rgba(255,255,255,0.65)}
    .required::after{content:" *";color:#ff7676}
  </style>
</head>
<body>
  <div class="panel">
    <label for="raw">Texto livre / contexto bruto</label>
    <textarea id="raw" placeholder="Cole logs, conversa ou detalhes extras aqui."></textarea>

    <div style="display:flex;gap:8px;margin-top:8px;align-items:center">
      <button id="importBtn" class="btn">Buscar contexto</button>
      <button id="parseBtn" class="btn">Extrair</button>
      <button id="copyBtn" class="btn primary">Copiar</button>
      <button id="exportBtn" class="btn">Baixar .md</button>
    </div>

    <div class="row" style="margin-top:8px">
      <div style="flex:1">
        <label for="bugId">BugID (sequencial)</label>
        <input id="bugId" readonly />
      </div>
      <div style="flex:1">
        <label for="reportAt">Timezone e horário do report</label>
        <input id="reportAt" readonly />
      </div>
    </div>

    <label for="title">Título</label>
    <input id="title" placeholder="Movimentações não exibem vendas aprovadas" />

    <div class="row" style="margin-top:8px">
      <div style="flex:1">
        <label for="orgId">OrgID</label>
        <input id="orgId" placeholder="952e030e226a5001c90ca6b" />
      </div>
      <div style="flex:1">
        <label for="company">Cliente</label>
        <input id="company" placeholder="Empresa Exemplo" />
      </div>
    </div>

    <label for="pageUrl">Página (URL)</label>
    <input id="pageUrl" placeholder="https://admin.online.engaged.com.br/..." />
    <div id="urlHint" class="muted" style="margin-top:6px"></div>

    <label for="errorPath">Caminho do erro</label>
    <input id="errorPath" placeholder="/admin/org/.../payments/..." />

    <label for="impact" class="required">Impacto</label>
    <textarea id="impact" placeholder="Ex: Financeiro não consegue validar fechamento diário."></textarea>

    <label for="expected">Comportamento esperado</label>
    <textarea id="expected" placeholder="Ex: Vendas aprovadas devem aparecer na tela de movimentações."></textarea>

    <label for="actual">Comportamento atual</label>
    <textarea id="actual" placeholder="Será pré-preenchido com sinais de erro do console/rede quando possível."></textarea>

    <label for="steps">Passo - Passo</label>
    <textarea id="steps" placeholder="Será sugerido automaticamente com base na página atual."></textarea>

    <label for="variables">Variables (extraídas da URL)</label>
    <textarea id="variables" readonly></textarea>

    <label for="observations">Observações</label>
    <textarea id="observations" placeholder="Dados adicionais do ambiente, cache, inconsistências e outros pontos úteis."></textarea>

    <label for="hypothesis">Hipótese (opcional)</label>
    <textarea id="hypothesis" placeholder="Possível causa raiz (opcional). Se vazio, não entra no relatório."></textarea>

    <label class="muted">Preview</label>
    <div id="preview" class="preview"></div>
  </div>

  <script src="threadFormatter.js"></script>
  <script src="popup.js"></script>
</body>
</html>
